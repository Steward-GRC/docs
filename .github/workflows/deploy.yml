name: deploy

# Only a published release puts the site live. Nothing else triggers this job.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # preCommands runs in a real shell (unlike `command`, which runs each
          # wrangler subcommand on its own), so the exists-check and the
          # conditional create can live in one line. The exact-name match on
          # `--json` output (the "Project Name" field) avoids a loose substring
          # match picking up a similarly named project; a second run finds the
          # project and skips creation, so this is safe to run on every deploy.
          preCommands: >-
            npx wrangler pages project list --json | jq -e
            '.[] | select(.["Project Name"] == "steward-grc-docs")' > /dev/null ||
            npx wrangler pages project create steward-grc-docs --production-branch=main
          # The release checks out a detached tag, so the branch is named explicitly:
          # a pre-release (rc) lands on the dev branch alias, anything else on production.
          command: pages deploy build --project-name=steward-grc-docs --branch=${{ github.event.release.prerelease && 'dev' || 'main' }}
